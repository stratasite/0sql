# Installed as /etc/netdata/go.d/docker.conf on the host.
#
# Docker uses the containerd image store there, so every image listing
# sizes each layer through containerd. Polling it once a second kept
# dockerd and containerd near a full core (2026-10-07). Once every 30s
# is plenty for container state and image counts.
update_every: 30
jobs:
  - name: local
    address: unix:///var/run/docker.sock
    timeout: 10
    collect_container_size: no
