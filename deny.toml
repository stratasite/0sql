# cargo-deny: what the dependency tree may contain. Run locally with
# `cargo deny check`; CI runs it on every push.

[graph]
all-features = true

[advisories]
# A crate with a known vulnerability, or one its authors have
# unmaintained, is an error until it is upgraded or justified here.
version = 2
yanked = "deny"
ignore = [
  # serde_yaml is deprecated and its C-translated backend is archived.
  # Not a vulnerability. The model files are YAML, so moving off it is
  # a parser swap across the loader, the dialects and the CLI; tracked,
  # not done here.
  { id = "RUSTSEC-2024-0449", reason = "serde_yaml's archived backend; a parser swap is tracked separately" },
  # fxhash is unmaintained, not vulnerable: a hash function behind the
  # picker's filtering in inquire. It goes when inquire moves off it.
  { id = "RUSTSEC-2025-0057", reason = "fxhash under inquire, a hash for the picker's filter; unmaintained, not a vulnerability" },
]

[licenses]
# This project is MIT; its tree may carry the permissive licenses below.
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  # The Mozilla CA bundle webpki-roots ships for TLS.
  "CDLA-Permissive-2.0",
  # A public-domain dedication: tiny-keccak, under const-random, in
  # DuckDB's tree. Nothing is owed under it.
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# Several versions of one crate are a size cost, not a fault; say so
# rather than fail.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
