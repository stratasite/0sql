[workspace]
resolver = "2"
members = [
  "crates/semantic",
  "crates/formation",
  "crates/dialect",
  "crates/spec",
  "crates/planner",
  "crates/project",
  "crates/shorthand",
  "crates/log",
  "crates/datasource",
  "crates/exec",
  "crates/core",
  "crates/server",
  "crates/golden",
  "crates/cli",
  "xtask",
]

[workspace.package]
version = "0.7.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/stratasite/0sql"
homepage = "https://0sql.io"

# Two of clippy's stylistic lints are allowed across the workspace:
# the planner's signatures are long because its types are, and the
# server's error variants carry a response. Everything else clippy
# says is an error in CI.
[workspace.lints.clippy]
type_complexity = "allow"
result_large_err = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
flate2 = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
# Every crate reports through this and none of them prints: crates/log
# is what a binary installs to decide where a report goes. Without the
# attribute macros, which nothing here uses.
tracing = { version = "0.1", default-features = false, features = ["std"] }
zsql-semantic = { path = "crates/semantic" }
zsql-formation = { path = "crates/formation" }
zsql-dialect = { path = "crates/dialect" }
zsql-spec = { path = "crates/spec" }
zsql-planner = { path = "crates/planner" }
zsql-project = { path = "crates/project" }
zsql-shorthand = { path = "crates/shorthand" }
zsql-log = { path = "crates/log" }
zsql-datasource = { path = "crates/datasource" }
zsql-exec = { path = "crates/exec" }
zsql-core = { path = "crates/core" }
zsql-server = { path = "crates/server" }
zsql-golden = { path = "crates/golden" }

# What a release ships: symbols stripped and thin link-time optimization,
# which took the binary from 97 MB to 76 MB with DuckDB in it. Fat LTO
# and one codegen unit buy little more and cost minutes of build.
[profile.release]
strip = true
lto = "thin"
