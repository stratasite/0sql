[workspace]
resolver = "2"
members = [
  "crates/semantic",
  "crates/formation",
  "crates/dialect",
  "crates/spec",
  "crates/planner",
  "crates/project",
  "crates/accounts",
  "crates/shorthand",
  "crates/source",
  "crates/exec",
  "crates/service",
  "crates/server",
  "crates/golden",
  "crates/devtool",
  "crates/cli",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/stratasite/0sql"
homepage = "https://0sql.io"

# Two of clippy's stylistic lints are allowed across the workspace:
# the planner's signatures are long because its types are, and the
# server's error variants carry a response. Everything else clippy
# says is an error in CI.
[workspace.lints.clippy]
type_complexity = "allow"
result_large_err = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
flate2 = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
zsql-semantic = { path = "crates/semantic" }
zsql-formation = { path = "crates/formation" }
zsql-dialect = { path = "crates/dialect" }
zsql-spec = { path = "crates/spec" }
zsql-planner = { path = "crates/planner" }
zsql-project = { path = "crates/project" }
zsql-accounts = { path = "crates/accounts" }
zsql-shorthand = { path = "crates/shorthand" }
zsql-source = { path = "crates/source" }
zsql-exec = { path = "crates/exec" }
zsql-service = { path = "crates/service" }
zsql-server = { path = "crates/server" }
zsql-golden = { path = "crates/golden" }

# What a release ships: symbols stripped and thin link-time optimization,
# which took the binary from 97 MB to 76 MB with DuckDB in it. Fat LTO
# and one codegen unit buy little more and cost minutes of build.
[profile.release]
strip = true
lto = "thin"
