[workspace]
resolver = "2"
members = [
  "crates/semantic",
  "crates/formation",
  "crates/dialect",
  "crates/spec",
  "crates/planner",
  "crates/project",
  "crates/warehouse",
  "crates/accounts",
  "crates/shorthand",
  "crates/service",
  "crates/server",
  "crates/golden",
  "crates/devtool",
  "crates/cli",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"

# Two of clippy's stylistic lints are allowed across the workspace:
# the planner's signatures are long because its types are, and the
# server's error variants carry a response. Everything else clippy
# says is an error in CI.
[workspace.lints.clippy]
type_complexity = "allow"
result_large_err = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
flate2 = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
zsql-semantic = { path = "crates/semantic" }
zsql-formation = { path = "crates/formation" }
zsql-dialect = { path = "crates/dialect" }
zsql-spec = { path = "crates/spec" }
zsql-planner = { path = "crates/planner" }
zsql-project = { path = "crates/project" }
zsql-warehouse = { path = "crates/warehouse" }
zsql-accounts = { path = "crates/accounts" }
zsql-shorthand = { path = "crates/shorthand" }
zsql-service = { path = "crates/service" }
zsql-golden = { path = "crates/golden" }
