[package]
name = "zsql-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zsqld: deploy a project, get SQL back"

[[bin]]
name = "zsqld"
path = "src/main.rs"

[dependencies]
zsql-semantic.workspace = true
zsql-dialect.workspace = true
zsql-spec.workspace = true
zsql-accounts.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
flate2.workspace = true
tar = "0.4"
zsql-service.workspace = true

[dev-dependencies]
zsql-shorthand.workspace = true
regex = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
