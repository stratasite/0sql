[package]
name = "zsql-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "The server: deploy a project, get SQL back; run by `zsql serve`"

[dependencies]
zsql-semantic.workspace = true
zsql-dialect.workspace = true
zsql-spec.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
flate2.workspace = true
tar = "0.4"
libc = "0.2"
zsql-core.workspace = true
tracing.workspace = true
zsql-datasource.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
zsql-shorthand.workspace = true
# The engine is already linked through zsql-datasource; the probe tests
# build a file with it the way a warehouse would hold one.
duckdb = { version = "1.20000.0", features = ["bundled"] }
regex = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
