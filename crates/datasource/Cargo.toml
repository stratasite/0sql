[package]
name = "zsql-datasource"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Reaching a datasource to read from it: the connection, its secret, and one read-only statement"

[dependencies]
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-postgres = "0.7"
# Reading a wire protocol's rows as they come: already in the tree
# under tokio-postgres and tiberius.
futures-util = { version = "0.3", default-features = false }
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
ureq = { version = "3", features = ["json"] }
ring = "0.17"
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
duckdb = { version = "1.20000.0", features = ["bundled"] }
# The result contract: record batches. The same Arrow DuckDB already
# brings, named here so the crate does not reach it through a driver.
arrow-array = "60"
arrow-schema = "60"
arrow-cast = "60"

# ADBC drivers are shared libraries loaded at run time, which a static
# musl binary cannot do; there the REST transports are the only path.
# The releases are glibc and macOS builds, which have it.
[target.'cfg(not(target_env = "musl"))'.dependencies]
adbc_core = "0.25"
adbc_driver_manager = "0.25"

[lints]
workspace = true
