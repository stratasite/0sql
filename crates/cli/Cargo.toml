[package]
name = "zsql-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zsql: author a semantic model, deploy it, and query it through a zsqld server"

[[bin]]
name = "zsql"
path = "src/main.rs"

[dependencies]
zsql-warehouse.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
flate2.workspace = true
tar = "0.4"
ureq = { version = "3", features = ["json"] }
rustyline = "15"
chrono = "0.4"
libc = "0.2"
