[package]
name = "zsql-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "zsql: author a semantic model, plan SQL from it here or on a zsqld server, deploy it"

[[bin]]
name = "zsql"
path = "src/main.rs"

[features]
# The default build plans locally and talks to a server; it has no
# warehouse drivers, so it builds everywhere in seconds. The full build
# adds `zsql values sample`, which runs the sampling SQL locally.
default = []
warehouse = ["dep:zsql-warehouse"]

[dependencies]
zsql-warehouse = { workspace = true, optional = true }
zsql-service.workspace = true
zsql-shorthand.workspace = true
zsql-dialect.workspace = true
zsql-spec.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
flate2.workspace = true
tar = "0.4"
ureq = { version = "3", features = ["json"] }
rustyline = "15"
chrono = "0.4"
libc = "0.2"
