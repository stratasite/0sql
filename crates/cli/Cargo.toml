[package]
name = "zsql-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "zsql: author a semantic model, plan SQL from it here or on a zsqld server, deploy it"

[[bin]]
name = "zsql"
path = "src/main.rs"

[features]
# The default build plans locally, talks to a server, and is one:
# `zsql serve` runs the server in this process. It needs a C compiler,
# for the SQLite behind accounts; `--no-default-features` is the slim
# build without the server. `warehouse` adds `zsql values sample`,
# which runs the sampling SQL locally.
default = ["server"]
server = ["dep:zsql-server"]
warehouse = ["dep:zsql-warehouse"]

[dependencies]
zsql-warehouse = { workspace = true, optional = true }
zsql-server = { workspace = true, optional = true }
zsql-service.workspace = true
zsql-shorthand.workspace = true
zsql-dialect.workspace = true
zsql-spec.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
flate2.workspace = true
tar = "0.4"
ureq = { version = "3", features = ["json"] }
rustyline = "15"
chrono = "0.4"
libc = "0.2"

[lints]
workspace = true
