# Builds zsql for the platforms people install it on and attaches the
# builds to a release. Only on a version tag, or by hand from the
# Actions tab; nothing is built on an ordinary push.
#
#   git tag v0.6.0 && git push origin v0.6.0
#
# One binary is the whole product: the CLI, and the server it runs with
# `zsql serve`, with the web app, the brand assets and the dialect
# files compiled in. Deploying a server is copying that file.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag says what version it is; the manifest has to agree, and that
  # is checked before four builds are spent on finding out.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          test "$manifest" = "$tag" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          }

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux builds are dynamically linked against glibc, and
          # the glibc they are built against is the oldest they will
          # run on. So they are built in an Ubuntu 22.04 container and
          # not on the runner: the runner's Ubuntu moves, and 22.04
          # runners are retired on 2027-04-17. See docs/linux-build.md.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            container: ubuntu:22.04
            asset: zsql-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: ubuntu:22.04
            asset: zsql-aarch64-linux
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: zsql-aarch64-macos
          # The runner is Apple silicon; Xcode carries both SDKs, so the
          # Intel build is a cross-compile on the same machine.
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: zsql-x86_64-macos
    runs-on: ${{ matrix.os }}
    # Empty for macOS, which builds on the runner itself.
    container: ${{ matrix.container }}
    steps:
      # A bare Ubuntu has no compiler and no rustup. GCC 11 is what
      # 22.04 carries, and it compiles DuckDB.
      - name: What the container lacks
        if: matrix.container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git file binutils
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
          rustc --version

      # The default build: the CLI with the server.
      #
      # On Linux the C++ runtime DuckDB needs is linked in, so that the
      # machine it runs on has to supply glibc and nothing else: `cc`
      # reads CXXSTDLIB, and rustc is told where GCC keeps the archive.
      # Not statically linked as a whole: a static binary cannot load an
      # ADBC driver, which is why this is not the musl build it was.
      - name: Build
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            export CXXSTDLIB=static:-bundle=stdc++
            export RUSTFLAGS="-L native=$(dirname "$(gcc -print-file-name=libstdc++.a)")"
          fi
          cargo build --release --locked --target ${{ matrix.target }} -p zsql-cli

      - name: Package
        run: |
          mkdir -p dist
          install -m755 target/${{ matrix.target }}/release/zsql dist/${{ matrix.asset }}
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi
          ls -l

      - name: It is what it claims to be
        run: file dist/${{ matrix.asset }}

      # What the Linux build asks of the machine it runs on: glibc's own
      # libraries and libgcc_s, which every glibc system has, and no
      # symbol newer than glibc 2.34. A new library here, or a newer
      # symbol, is a machine it stops running on, so it fails the
      # release and is decided, not discovered.
      - name: It needs glibc 2.34 and nothing else
        if: runner.os == 'Linux'
        run: |
          needed=$(objdump -p dist/${{ matrix.asset }} | awk '$1 == "NEEDED" { print $2 }' | sort)
          echo "$needed"
          extra=$(echo "$needed" | grep -vxE 'libc\.so\.6|libm\.so\.6|libgcc_s\.so\.1|ld-linux-[a-z0-9-]+\.so\.[0-9]' || true)
          test -z "$extra" || { echo "needs more than glibc: $extra"; exit 1; }
          newest=$(objdump -T dist/${{ matrix.asset }} | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "newest symbol: $newest"
          test "$(printf '%s\n' GLIBC_2.34 "$newest" | sort -V | tail -1)" = GLIBC_2.34 || {
            echo "needs $newest, newer than glibc 2.34"
            exit 1
          }

      # Each of these runs on the machine that built it, so the arm64
      # Linux build and the Apple silicon one are run; the Intel macOS
      # build is a cross-compile and is not.
      - name: It really runs
        if: runner.os == 'Linux' || matrix.target == 'aarch64-apple-darwin'
        run: |
          ./dist/${{ matrix.asset }} --version
          ./dist/${{ matrix.asset }} --help > /dev/null

      # The server inside it comes up and answers. Job control is off in
      # this shell, so the pid is kept by hand.
      - name: The server really starts
        if: runner.os == 'Linux' || matrix.target == 'aarch64-apple-darwin'
        run: |
          ZSQL_HOME=$(mktemp -d) ./dist/${{ matrix.asset }} serve --bind 127.0.0.1:3699 &
          pid=$!
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:3699/healthz >/dev/null 2>&1 && break || sleep 0.5; done
          curl -fsS http://127.0.0.1:3699/healthz
          kill "$pid"

      # A name to resolve and a certificate to check, in one go: this
      # asks the public server how it is. It does mean a release needs
      # that host to be up.
      - name: It can reach a server
        if: runner.os == 'Linux'
        run: ./dist/${{ matrix.asset }} health --server https://app.0sql.io

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  # The Linux builds on the oldest glibc they claim, 2.34, which is
  # what Amazon Linux 2023 and RHEL 9 carry, and with the ADBC drivers
  # installed the way a user installs them. Loading a driver is what
  # these builds are dynamic for. It does mean a release needs
  # Columnar's driver registry to be up.
  floor:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: zsql-x86_64-linux
          - os: ubuntu-24.04-arm
            asset: zsql-aarch64-linux
    runs-on: ${{ matrix.os }}
    container: amazonlinux:2023
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: It runs on glibc 2.34
        run: |
          ldd --version | head -1
          chmod +x dist/${{ matrix.asset }}
          ./dist/${{ matrix.asset }} --version
          ./dist/${{ matrix.asset }} datasource drivers

      - name: It loads the drivers
        run: |
          # dbc's installer unpacks an archive, and this image has no tar.
          dnf install -y -q tar gzip
          curl -LsSf https://dbc.columnar.tech/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          dbc install snowflake
          dbc install bigquery
          ./dist/${{ matrix.asset }} datasource drivers | tee drivers.txt
          grep -qx 'snowflake: loaded' drivers.txt
          grep -qx 'bigquery: loaded' drivers.txt

  release:
    needs: [build, floor]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: One checksum file for the installer to read
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256
          ls -l

      # The repository is named: this job checks nothing out, so gh has
      # no git tree to read it from.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "zsql ${GITHUB_REF_NAME#v}" dist/*
