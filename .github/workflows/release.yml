# Builds zsql for the platforms people install it on and attaches the
# builds to a release. Only on a version tag, or by hand from the
# Actions tab; nothing is built on an ordinary push.
#
#   git tag v0.6.0 && git push origin v0.6.0
#
# One binary is the whole product: the CLI, and the server it runs with
# `zsql serve`, with the web app, the brand assets and the dialect
# files compiled in. Deploying a server is copying that file.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag says what version it is; the manifest has to agree, and that
  # is checked before four builds are spent on finding out.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          test "$manifest" = "$tag" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          }

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built in cross's container like the arm64 one: DuckDB is C++,
          # and musl-tools on the runner has a C compiler but no C++. The
          # container is pinned in Cross.toml, because cross's own is too
          # old to compile DuckDB.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: zsql-x86_64-linux
            cross: true
          # No arm64 Linux runner on this plan, so this one is built in
          # a container for the target rather than on it.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: zsql-aarch64-linux
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: zsql-aarch64-macos
            cross: false
          # The runner is Apple silicon; Xcode carries both SDKs, so the
          # Intel build is a cross-compile on the same machine.
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: zsql-x86_64-macos
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
          rustc --version

      # The images are pinned by digest in Cross.toml: cross's own carry
      # a 2019 compiler that DuckDB's C++ does not build with.
      #
      # musl, not glibc, on Linux. A static glibc binary cannot resolve
      # names: it loads its name service modules at runtime and dumps
      # core without them. musl resolves names and still links
      # statically, so the binary runs on any distribution and can be
      # given a hostname to bind or to reach. SQLite is C and DuckDB is
      # C++, so both Linux targets build in cross's container, which
      # carries a musl toolchain with both compilers.

      - name: cross
        if: matrix.cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin cross
          cross --version

      # The default build: the CLI with the server.
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p zsql-cli
          else
            cargo build --release --locked --target ${{ matrix.target }} -p zsql-cli
          fi

      - name: Package
        run: |
          mkdir -p dist
          install -m755 target/${{ matrix.target }}/release/zsql dist/${{ matrix.asset }}
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi
          ls -l

      - name: It is what it claims to be
        run: file dist/${{ matrix.asset }}

      # The Linux build must be static: that is what lets it run on any
      # distribution.
      - name: It is really static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file dist/${{ matrix.asset }} | grep -qE 'static(ally linked|-pie linked)'
          ! ldd dist/${{ matrix.asset }} 2>/dev/null | grep -q '=>'

      # Only the two that can run here. The cross-built ones are checked
      # by whoever installs them, and by the installer's checksum.
      - name: It really runs
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: |
          ./dist/${{ matrix.asset }} --version
          ./dist/${{ matrix.asset }} --help > /dev/null

      # The server inside it comes up and answers. Job control is off in
      # this shell, so the pid is kept by hand.
      - name: The server really starts
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: |
          ZSQL_HOME=$(mktemp -d) ./dist/${{ matrix.asset }} serve --bind 127.0.0.1:3699 &
          pid=$!
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:3699/healthz >/dev/null 2>&1 && break || sleep 0.5; done
          curl -fsS http://127.0.0.1:3699/healthz
          kill "$pid"

      # The one thing a static Linux binary can plausibly get wrong is
      # reaching a server at all: a name to resolve and a certificate to
      # check, both of which a statically linked glibc would fail. This
      # asks the public server how it is, which exercises the resolver,
      # TLS and HTTP in one go. It does mean a release needs that host
      # to be up.
      - name: It can reach a server
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: ./dist/${{ matrix.asset }} health --server https://app.0sql.io

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One checksum file for the installer to read
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256
          ls -l

      # The repository is named: this job checks nothing out, so gh has
      # no git tree to read it from.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "zsql ${GITHUB_REF_NAME#v}" dist/*
