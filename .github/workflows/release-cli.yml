# Builds the CLI for the platforms people install it on, and attaches
# them to a release. Its own tag, separate from the server's: the
# server ships to one machine we run, the CLI ships to everyone else,
# and the two should not be forced to move together.
#
#   git tag cli-v0.1.1 && git push origin cli-v0.1.1
#
# The server's tags stay `v*` and do not trigger this. Both read the
# version from the workspace manifest, so `cli-v0.1.1` and `v0.1.1` are
# the same source: the suffix says which half is being shipped.
name: release-cli

on:
  push:
    tags: ["cli-v*"]
  # Build without cutting a release, to try the pipeline or take a
  # binary from a branch. The results land in the run's artifacts.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: zsql-x86_64-linux
            cross: false
          # No arm64 Linux runner on this plan, so this one is built in
          # a container for the target rather than on it.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: zsql-aarch64-linux
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: zsql-aarch64-macos
            cross: false
          # The runner is Apple silicon; Xcode carries both SDKs, so the
          # Intel build is a cross-compile on the same machine.
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: zsql-x86_64-macos
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
          rustc --version

      # musl, not glibc. The CLI resolves the server's hostname, and
      # glibc cannot do that from a static binary: it loads its name
      # service modules at runtime and dumps core without them. musl
      # resolves names and still links statically.
      - name: musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: cross
        if: matrix.cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin cross
          cross --version

      # The default build: no warehouse drivers, so it needs nothing
      # but a C compiler for ring, builds in seconds, and is the one the
      # installer ships. `zsql values sample` is the full build.
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p zsql-cli
          else
            cargo build --release --locked --target ${{ matrix.target }} -p zsql-cli
          fi

      - name: Package
        run: |
          mkdir -p dist
          install -m755 target/${{ matrix.target }}/release/zsql dist/${{ matrix.asset }}
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi
          ls -l

      - name: It is what it claims to be
        run: file dist/${{ matrix.asset }}

      # Only the two that can run here. The cross-built ones are checked
      # by whoever installs them, and by the installer's checksum.
      - name: It really runs
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: |
          ./dist/${{ matrix.asset }} --version
          ./dist/${{ matrix.asset }} --help > /dev/null

      # The one thing a static Linux binary can plausibly get wrong is
      # reaching a server at all: a name to resolve and a certificate to
      # check, both of which a statically linked glibc would fail. This
      # asks the public server how it is, which exercises the resolver,
      # TLS and HTTP in one go. It does mean a release needs that host
      # to be up.
      - name: It can reach a server
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: ./dist/${{ matrix.asset }} health --server https://app.0sql.io

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the crate version
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#cli-v}"
          test "$manifest" = "$tag" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One checksum file for the installer to read
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256
          ls -l

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "CLI ${GITHUB_REF_NAME#cli-}" dist/*

      # The repository is private, so a public installer cannot read its
      # releases. When a public bucket is configured the same files go
      # there too, under the version and under `latest`, which is what
      # 0sql.io/install.sh downloads. Without the secrets this does
      # nothing and the release is still made.
      - name: Publish for the installer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_SECRET }}
          AWS_ENDPOINT_URL: ${{ secrets.DOWNLOADS_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ secrets.DOWNLOADS_REGION }}
          BUCKET: ${{ secrets.DOWNLOADS_BUCKET }}
        run: |
          if [ -z "$BUCKET" ]; then
            echo "no downloads bucket configured; the release is on GitHub only"
            exit 0
          fi
          version="${GITHUB_REF_NAME#cli-v}"
          aws s3 cp dist "s3://$BUCKET/cli/$version/" --recursive --only-show-errors
          aws s3 cp dist "s3://$BUCKET/cli/latest/" --recursive --only-show-errors
          echo "$version" | aws s3 cp - "s3://$BUCKET/cli/latest/VERSION" --only-show-errors
          echo "published to s3://$BUCKET/cli/$version/ and cli/latest/"
