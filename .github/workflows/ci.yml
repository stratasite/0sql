# Every push and pull request: formatting, clippy with warnings as
# errors, the tests, the golden scoreboard, the CLI's feature
# combinations, cargo-deny over the dependency tree, and a macOS
# compile of the CLI. The toolchain is whatever rust-toolchain.toml
# names, as the release workflow uses.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Goldens
        run: cargo run --release --locked -p zsql-devtool -- golden --strict
      - name: CLI without defaults
        run: cargo check --locked -p zsql-cli --no-default-features

  # The transports in zsql-source against real servers, one container per
  # warehouse that can run without a cloud account. Its own job so a slow
  # image never holds up the planner's tests; the ignored tests are the
  # ones that need a server, and here they get one.
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Warehouses
        run: docker compose -f harness/sources/compose.yml up -d --wait --wait-timeout 540
      - name: Transports against them
        env:
          ZSQL_TEST_PG_HOST: localhost
          ZSQL_TEST_PG_USER: postgres
          ZSQL_TEST_PG_DB: postgres
          ZSQL_TEST_PG_PASSWORD: zsql
          ZSQL_TEST_CLICKHOUSE_URL: http://localhost:8123
          ZSQL_TEST_CLICKHOUSE_USER: default
          ZSQL_TEST_CLICKHOUSE_PASSWORD: zsql
          ZSQL_TEST_CLICKHOUSE_DB: default
          ZSQL_TEST_MYSQL_HOST: localhost
          ZSQL_TEST_MYSQL_USER: root
          ZSQL_TEST_MYSQL_PASSWORD: zsql
          ZSQL_TEST_MYSQL_DB: zsql
          ZSQL_TEST_MSSQL_HOST: localhost
          ZSQL_TEST_MSSQL_USER: sa
          ZSQL_TEST_MSSQL_PASSWORD: Zsql-test-1
          ZSQL_TEST_MSSQL_DB: master
          ZSQL_TEST_TRINO_URL: http://localhost:8080
          ZSQL_TEST_TRINO_DB: tpch
        run: cargo test --locked -p zsql-source -- --ignored
      - name: Warehouses down
        if: always()
        run: docker compose -f harness/sources/compose.yml down -v

  # Advisories, licences and sources of every crate in the tree, from
  # deny.toml. No build, so it is quick and runs on its own.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The release builds for macOS too, and a platform-only break (the
  # name of errno, once) reached a tag because nothing here compiled
  # for it. A check, not the tests: the Linux job runs those.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: CLI compiles
        run: cargo check --locked -p zsql-cli --all-targets
