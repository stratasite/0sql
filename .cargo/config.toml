# Linking the bundled DuckDB on musl.
#
# `libduckdb-sys` splits one object out of the DuckDB library into its own
# archive and links it whole-archive, because nothing inside the library
# references it and the linker would otherwise drop it, leaving the linked
# extensions unregistered. That object calls
# `duckdb_register_static_extensions`, which is defined back in the
# library.
#
# cargo bundles the library into the `libduckdb_sys` rlib, and rustc puts
# rlibs before the native libraries, so the archive that needs the symbol
# is read after the one that defines it. GNU ld walks the line once: when
# it reads the rlib nothing wants that symbol yet, so it skips the member,
# and the reference arrives with nothing left to satisfy it.
#
# glibc and macOS link anyway, because something else there pulls the same
# object in for its own reasons and this symbol comes along with it. That
# is luck, not design, and musl does not share it. Naming the symbol as
# wanted up front makes the member load when the rlib is read.
#
# Found 2026-10-25, when the first release to bundle DuckDB failed on both
# Linux targets. Drop this when libduckdb-sys orders the two itself.

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-Wl,-u,duckdb_register_static_extensions"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-Wl,-u,duckdb_register_static_extensions"]
