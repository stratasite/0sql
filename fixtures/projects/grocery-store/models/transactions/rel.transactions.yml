datasource: complete_journey

# Transactions fact to shared dimensions

transactions_date:
  left: Transactions
  right: Date
  sql: left.DAY = right.Day_Idx
  cardinality: many_to_one

transactions_household:
  left: Transactions
  right: Household
  sql: left.household_key = right.household_key
  cardinality: many_to_one

transactions_product:
  left: Transactions
  right: Product
  sql: left.PRODUCT_ID = right.PRODUCT_ID
  cardinality: many_to_one

transactions_store:
  left: Transactions
  right: Store
  sql: left.STORE_ID = right.STORE_ID
  cardinality: many_to_one
